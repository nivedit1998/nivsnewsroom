name: Daily ingest & publish JSON

on:
  schedule:
    # Runs daily at 08:30 UTC (≈ 09:30 London during BST; 08:30 London in winter)
    - cron: "30 8 * * *"
  workflow_dispatch: {} # allow manual run from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow committing generated JSON back to the repo
    concurrency:
      group: "ingest"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Generate JSON (ingest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOKBACK_DAYS: "7"
          TEST_MODE: "0"
        run: node scripts/ingest.mjs

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(data): refresh news JSON [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
